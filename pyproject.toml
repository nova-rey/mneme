[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mneme"
version = "0.1.0"
description = "Model Instance Development Through Earned Association"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
gemma = ["huggingface-hub>=0.24"]
local-nli = [
  "torch>=2.2",
  "transformers>=4.40",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
]

[project.scripts]
mneme = "mneme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mneme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a configured external or local model backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/mneme/state/*.py" = ["E501"]
"src/mneme/cli.py" = ["E501"]
"tests/test_state_*.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["mneme"]
